version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: claims-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/claims.db:/app/claims.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: claims-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped